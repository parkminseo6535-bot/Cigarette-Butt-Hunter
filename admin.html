<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>꽁초헌터 관리자</title>

<!-- Supabase JS Client -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background: #f6f7f9; color: #111827; }
  header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; }
  header h1 { font-size: 1.05rem; margin: 0; }
  header .user-info { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: #374151; }
  header button { background: none; border: none; color: #6b7280; text-decoration: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  .login-box { max-width: 340px; margin: 80px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 28px; box-shadow: 0 12px 30px rgba(15,23,42,0.08); }
  .login-box h2 { margin: 0 0 18px; font-size: 1.1rem; }
  .login-box input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; margin-bottom: 12px; font-family: inherit; }
  .login-box button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #059669; color: #fff; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  .error-msg { background: rgba(220,38,38,0.08); color: #dc2626; border: 1px solid rgba(220,38,38,0.2); border-radius: 8px; padding: 8px 12px; font-size: 0.82rem; margin-bottom: 12px; display: none; }
  .warn-box { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; border-radius: 10px; padding: 14px 16px; font-size: 0.85rem; line-height: 1.6; margin-bottom: 20px; }
  .report-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; margin-bottom: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .report-thumb { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: #f1f5f4; flex-shrink: 0; }
  .report-form { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 8px; }
  .report-form input[type=text], .report-form textarea, .report-form select {
    width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 0.85rem; font-family: inherit;
  }
  .report-form textarea { resize: vertical; min-height: 44px; }
  .report-meta { font-size: 0.74rem; color: #9ca3af; display: flex; gap: 10px; flex-wrap: wrap; }
  .report-actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .btn { padding: 7px 14px; border-radius: 7px; border: none; font-size: 0.8rem; font-weight: 700; cursor: pointer; }
  .btn-save { background: #059669; color: #fff; }
  .btn-delete { background: #fff; color: #dc2626; border: 1px solid rgba(220,38,38,0.3); align-self: flex-start; }
  .save-status { font-size: 0.78rem; color: #059669; }
  .empty, .loading { text-align: center; color: #9ca3af; padding: 60px 0; }
  .count-badge { font-size: 0.8rem; color: #6b7280; margin-bottom: 14px; }
</style>
</head>
<body>

<div id="loginBox" class="login-box">
  <h2>꽁초헌터 관리자 로그인</h2>
  <div id="loginError" class="error-msg"></div>
  <form id="loginForm">
    <input type="text" id="loginUsername" placeholder="아이디" required autocomplete="username" />
    <input type="password" id="loginPassword" placeholder="비밀번호" required autocomplete="current-password" />
    <button type="submit">로그인</button>
  </form>
</div>

<div id="dashboard" style="display:none;">
  <header>
    <h1>꽁초헌터 관리자</h1>
    <div class="user-info">
      <span id="headerUser"></span>
      <button id="btnLogout">로그아웃</button>
    </div>
  </header>
  <main>
    <div id="countBadge" class="count-badge"></div>
    <div id="reportList"></div>
  </main>
</div>

<script type="module">
  import {
    signIn,
    signOut,
    getCurrentUser,
    isLive,
    adminFetchAllReports,
    adminUpdateReport,
    adminDeleteReport
  } from './js/supabaseClient.js';

  const SEVERITY_LABELS = { critical: '매우 심각', severe: '심함', medium: '보통', slight: '약간' };

  let currentUser = null;

  document.getElementById('loginForm').addEventListener('submit', handleLogin);
  document.getElementById('btnLogout').addEventListener('click', handleLogout);

  init();

  async function init() {
    if (!isLive()) {
      document.getElementById('loginBox').innerHTML = `
        <h2>Supabase 연동 필요</h2>
        <div class="warn-box">
          js/config.js에 Supabase URL/anon key가 설정되어 있지 않습니다.
          먼저 사이트(index.html)에서 Supabase 연동을 완료한 뒤 관리자 페이지를 사용해주세요.
        </div>`;
      return;
    }
    currentUser = await getCurrentUser();
    render();
  }

  async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorBox = document.getElementById('loginError');
    errorBox.style.display = 'none';

    try {
      await signIn(username, password);
      currentUser = await getCurrentUser();
      render();
    } catch (err) {
      errorBox.innerText = err.message || '로그인에 실패했습니다.';
      errorBox.style.display = 'block';
    }
  }

  async function handleLogout() {
    await signOut();
    currentUser = null;
    render();
  }

  function render() {
    const loginBox = document.getElementById('loginBox');
    const dashboard = document.getElementById('dashboard');

    if (!currentUser) {
      loginBox.style.display = 'block';
      dashboard.style.display = 'none';
      return;
    }

    loginBox.style.display = 'none';
    dashboard.style.display = 'block';

    if (!currentUser.isAdmin) {
      document.getElementById('headerUser').innerText = currentUser.username;
      document.getElementById('countBadge').innerText = '';
      document.getElementById('reportList').innerHTML = `
        <div class="warn-box">
          "${escapeHtml(currentUser.username)}" 계정은 관리자 권한이 없습니다.
          Supabase SQL Editor에서 아래 SQL을 실행해 권한을 부여해주세요.<br /><br />
          <code>update public.profiles set is_admin = true where username = '${escapeHtml(currentUser.username)}';</code>
        </div>`;
      return;
    }

    document.getElementById('headerUser').innerText = currentUser.username + ' (관리자)';
    loadReports();
  }

  async function loadReports() {
    const list = document.getElementById('reportList');
    list.innerHTML = '<p class="loading">불러오는 중...</p>';

    const reports = await adminFetchAllReports();

    if (reports.length === 0) {
      document.getElementById('countBadge').innerText = '';
      list.innerHTML = '<div class="empty">등록된 신고가 없습니다.</div>';
      return;
    }

    document.getElementById('countBadge').innerText = `전체 ${reports.length}건 (최신순, 최대 300건 표시)`;
    list.innerHTML = '';
    reports.forEach(r => list.appendChild(buildReportCard(r)));
  }

  function buildReportCard(r) {
    const card = document.createElement('div');
    card.className = 'report-card';

    const severityOptions = Object.entries(SEVERITY_LABELS)
      .map(([val, label]) => `<option value="${val}" ${r.severity === val ? 'selected' : ''}>${label}</option>`)
      .join('');

    card.innerHTML = `
      <img class="report-thumb" src="${escapeAttr(r.image_url || '')}" alt="" />
      <div class="report-form">
        <input type="text" class="f-title" value="${escapeAttr(r.title || '')}" placeholder="제목" />
        <textarea class="f-desc" placeholder="상세 설명">${escapeHtml(r.description || '')}</textarea>
        <div style="display:flex; gap:8px;">
          <select class="f-severity" style="max-width:160px;">${severityOptions}</select>
          <input type="text" class="f-address" value="${escapeAttr(r.address || '')}" placeholder="주소" style="flex:1;" />
        </div>
        <div class="report-meta">
          <span>제보자: ${escapeHtml(r.guest_name || '익명 헌터')}</span>
          <span>❤ ${r.likes_count || 0}</span>
          <span>🧹 ${r.cleanup_votes || 0}</span>
          <span>${formatDate(r.created_at)}</span>
        </div>
        <div class="report-actions">
          <button type="button" class="btn btn-save">저장</button>
          <span class="save-status"></span>
        </div>
      </div>
      <button type="button" class="btn btn-delete">삭제</button>
    `;

    card.querySelector('.btn-save').addEventListener('click', async () => {
      const status = card.querySelector('.save-status');
      status.style.color = '#059669';
      status.innerText = '저장 중...';
      try {
        await adminUpdateReport(r.id, {
          title: card.querySelector('.f-title').value.trim(),
          description: card.querySelector('.f-desc').value.trim(),
          severity: card.querySelector('.f-severity').value,
          address: card.querySelector('.f-address').value.trim()
        });
        status.innerText = '저장됨 ✓';
        setTimeout(() => { status.innerText = ''; }, 2000);
      } catch (err) {
        status.style.color = '#dc2626';
        status.innerText = err.message || '저장 실패';
      }
    });

    card.querySelector('.btn-delete').addEventListener('click', async () => {
      if (!confirm('이 신고를 삭제할까요? 되돌릴 수 없습니다.')) return;
      try {
        await adminDeleteReport(r.id, r.image_url);
        card.remove();
      } catch (err) {
        alert(err.message || '삭제 실패');
      }
    });

    return card;
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }
  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  }
</script>

</body>
</html>
